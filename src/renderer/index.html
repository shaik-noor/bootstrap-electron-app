<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyApp</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:"
    />
    <!--
      Critical inline theme background — prevents a white flash in dev before
      Vite injects the stylesheet. Values must match --background in main.css:
        dark  oklch(0.226 0 0) = #1c1c1c
        light oklch(0.984…)   ≈ #faf9f3
    -->
    <style>
      html,
      body {
        background-color: #faf9f3;
      }
      html.dark,
      html.dark body {
        background-color: #1c1c1c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
